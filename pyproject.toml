[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memorygraphmcp"
version = "0.1.0"
description = "Production-ready MCP server for secure long-term memory over ArangoDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "fastmcp>=4.0.0b3,<5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.6,<3",
  "python-arango>=8,<9",
  "pyjwt>=2.9,<3",
  "structlog>=25,<26",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-instrumentation-asgi>=0.49b0,<1",
  "uvicorn[standard]>=0.30,<1",
  "anyio>=4,<5",
  "cryptography>=50.0.0",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
memorygraphmcp = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
